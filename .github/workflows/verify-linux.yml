name: Verify Linux (x64 + arm64)

# Verification only: no tag trigger, no release step, --publish=never.
#
# Both architectures get a NATIVE job. An arm64 package cross-built on an x64
# runner can be produced but not launched, and a package that has never been
# started is not evidence that it works — so each architecture builds and runs
# on its own runner and reports its own result.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            uname: x86_64
            elf: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            elf: aarch64

    steps:
      - name: Assert this runner really is Linux ${{ matrix.arch }}
        run: |
          set -eu
          echo "runner label: ${{ matrix.runner }}"
          uname -a
          cat /etc/os-release | head -3
          test "$(uname -s)" = "Linux"
          if [ "$(uname -m)" != "${{ matrix.uname }}" ]; then
            echo "::error::runner ${{ matrix.runner }} reports $(uname -m), not ${{ matrix.uname }} —"\
                 "this job would cross-build and call it native."
            exit 1
          fi
          echo "native ${{ matrix.arch }} runner confirmed"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Assert the toolchain satisfies package.json engines
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          echo "app requires    $(node -p "require('./package.json').engines.node")"
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if (maj<22 || (maj===22 && min<12)) { console.error('Node ' + process.versions.node + ' is below the 22.12.0 Electron 44 requires'); process.exit(1); }"

      # Runtime libraries Electron links against, the packaging tools for deb
      # and AppImage, plus the three things the Electron suites genuinely need
      # on a headless machine: a display, a session bus and a keyring.
      #
      # gnome-keyring is not optional decoration: safeStorage refuses to store
      # a credential without one, and this project's whole point is that it
      # must refuse rather than write a secret in the clear. A run without a
      # keyring would exercise the refusal path and call it a pass.
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libsecret-1-0 libgbm1 libasound2t64 \
            xvfb dbus-x11 gnome-keyring libarchive-tools fakeroot rpm

      - name: Install from the lockfile
        run: npm ci

      - name: Confirm the Electron binary was provisioned
        run: |
          expected=$(node -p "require('./package.json').devDependencies.electron")
          actual=$(node -p "require('./node_modules/electron/package.json').version")
          echo "electron package $actual (expected $expected)"
          test "$actual" = "$expected"
          node -e "const p=require('electron'); const fs=require('fs'); if(!fs.existsSync(p)) { console.error('electron binary missing at ' + p); process.exit(1); } console.log('electron binary', p, fs.statSync(p).size, 'bytes');"

      - name: Unit tests
        run: npm test

      - name: Syntax check every entry point
        run: |
          for f in main.js preload.js src/renderer/app.js src/providers.js src/usage-status.js \
                   src/manual-entry.js src/config-recovery.js src/credential-store.js \
                   src/platform-paths.js src/read-errors.js; do
            node --check "$f" && echo "ok  $f"
          done

      # A real display and a real session bus, with an unlocked keyring inside
      # that bus so safeStorage has something to talk to. No --no-sandbox and
      # no skipping: the suites isolate HOME, XDG_* and Electron's own path
      # table themselves and assert that isolation before they start.
      - name: Electron suites (cancellation, usage status, provider reader)
        run: |
          cat > /tmp/run-suites.sh <<'SCRIPT'
          set -e
          echo -n 'ci-test-keyring' | gnome-keyring-daemon --unlock --components=secrets,pkcs11
          npm run test:electron
          npm run test:electron:usage
          npm run test:electron:reader
          SCRIPT
          chmod +x /tmp/run-suites.sh
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' \
            dbus-run-session -- /tmp/run-suites.sh

      - name: Failure-path suites
        run: |
          cat > /tmp/run-failures.sh <<'SCRIPT'
          set -e
          echo -n 'ci-test-keyring' | gnome-keyring-daemon --unlock --components=secrets,pkcs11
          node test/run-failure-phases.cjs --out test-results/failure-phases
          SCRIPT
          chmod +x /tmp/run-failures.sh
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' \
            dbus-run-session -- /tmp/run-failures.sh

      # Only this runner's own architecture is built here, so nothing implies a
      # package was tested on a machine it never ran on.
      - name: Build the ${{ matrix.arch }} packages
        run: npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish=never

      - name: Assert the built binary is ${{ matrix.arch }}, natively
        run: |
          set -eu
          mkdir -p test-results
          binary=$(ls dist/linux*unpacked/claude-usage-widget 2>/dev/null \
            || ls dist/*unpacked/claude-usage-widget | head -1)
          file "$binary" | tee test-results/binary-arch.txt
          file "$binary" | grep -q '${{ matrix.elf }}'
          echo "the package matches the architecture of the machine that built and ran it" \
            >> test-results/binary-arch.txt

      - name: Verify what is actually inside the package
        run: |
          unpacked=$(ls -d dist/linux*unpacked | head -1)
          echo "inspecting $unpacked"
          node test/verify-package-contents.cjs --app "$unpacked" --source . --out test-results/package

      - name: Launch the packaged application twice on a synthetic profile
        run: |
          unpacked=$(ls -d dist/linux*unpacked | head -1)
          cat > /tmp/run-packaged.sh <<SCRIPT
          set -e
          echo -n 'ci-test-keyring' | gnome-keyring-daemon --unlock --components=secrets,pkcs11
          node test/packaged-smoke.cjs --exe "$unpacked/claude-usage-widget" --out test-results/packaged-unpacked
          SCRIPT
          chmod +x /tmp/run-packaged.sh
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' \
            dbus-run-session -- /tmp/run-packaged.sh

      - name: Launch the AppImage
        run: |
          appimage=$(ls dist/*.AppImage | head -1)
          chmod +x "$appimage"
          # --appimage-extract-and-run avoids needing FUSE on the runner, and
          # still executes the packaged binary from inside the image.
          cat > /tmp/run-appimage.sh <<SCRIPT
          set -e
          echo -n 'ci-test-keyring' | gnome-keyring-daemon --unlock --components=secrets,pkcs11
          APPIMAGE_EXTRACT_AND_RUN=1 node test/packaged-smoke.cjs --exe "$appimage" --out test-results/packaged-appimage
          SCRIPT
          chmod +x /tmp/run-appimage.sh
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' \
            dbus-run-session -- /tmp/run-appimage.sh

      - name: Responsive design captures
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' \
            dbus-run-session -- npm run test:electron:screens -- test-results/screenshots

      - name: Dependency audit (reported, never auto-fixed)
        run: |
          npm audit --json > test-results/npm-audit.json || true
          npm audit || echo "::warning::npm audit reported findings — see test-results/npm-audit.json"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-linux-${{ matrix.arch }}-evidence
          path: test-results/
          if-no-files-found: warn

      - name: Upload the Linux ${{ matrix.arch }} packages
        uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-Monitor-linux-${{ matrix.arch }}-unsigned
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
