name: Verify Windows (x64)

# Verification only. There is deliberately no tag trigger, no release step and
# no publish token: electron-builder is invoked with --publish=never and
# build.publish is null, so a run of this workflow cannot put anything in front
# of a user. Producing a release is a separate, explicit decision.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows x64
    runs-on: windows-latest
    # A hung step must not hold a runner for hours.
    timeout-minutes: 45

    steps:
      - name: Assert this runner really is Windows x64
        shell: pwsh
        run: |
          Write-Host "runner label: windows-latest"
          Write-Host ([System.Environment]::OSVersion.VersionString)
          Write-Host "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "OS architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          if (-not $IsWindows) { Write-Error 'this job is not running on Windows'; exit 1 }
          if ("$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)" -ne 'X64') {
            Write-Error "runner reports $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture), not X64 - this job would cross-build and call it native."
            exit 1
          }
          Write-Host 'native x64 runner confirmed'

      - name: Checkout
        uses: actions/checkout@v5

      # Electron 44's own package.json requires Node >= 22.12.0. The previous
      # workflows pinned Node 20, which cannot install or rebuild it.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # This step runs BEFORE npm ci, so it may only read files that exist in a
      # fresh checkout. It used to read node_modules/electron/package.json
      # here: on a clean runner that require throws, the pwsh step exits with
      # the failing LASTEXITCODE, and the whole workflow failed at its second
      # step for a reason that had nothing to do with the toolchain. What
      # Electron itself wants is reported after the install instead, where the
      # file actually exists.
      - name: Assert the toolchain satisfies package.json engines
        shell: pwsh
        run: |
          $required = (node -p "require('./package.json').engines.node")
          Write-Host "node        $(node -v)"
          Write-Host "npm         $(npm -v)"
          Write-Host "app requires    $required"
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if (maj<22 || (maj===22 && min<12)) { console.error('Node ' + process.versions.node + ' is below the 22.12.0 Electron 44 requires'); process.exit(1); }"

      # npm ci, from the committed lockfile, so the verified tree is the
      # locked tree.
      - name: Install from the lockfile
        run: npm ci

      - name: Confirm the Electron binary was provisioned
        shell: pwsh
        run: |
          $expected = (node -p "require('./package.json').devDependencies.electron")
          $actual = (node -p "require('./node_modules/electron/package.json').version")
          Write-Host "electron package $actual (expected $expected)"
          if ($actual -ne $expected) { throw "electron $actual does not match the pinned $expected" }
          # Installed now, so this file can be read.
          $wants = (node -p "require('./node_modules/electron/package.json').engines?.node ?? 'unspecified'")
          Write-Host ("electron wants node " + $wants)
          # `require('electron')` outside an Electron process resolves to the
          # binary path; if the postinstall download did not happen this fails
          # here rather than three steps later.
          node -e "const p=require('electron'); const fs=require('fs'); if(!fs.existsSync(p)) { console.error('electron binary missing at ' + p); process.exit(1); } console.log('electron binary', p, fs.statSync(p).size, 'bytes');"

      - name: Unit tests
        run: npm test

      - name: Syntax check every entry point
        shell: pwsh
        run: |
          foreach ($f in @('main.js','preload.js','src/renderer/app.js','src/providers.js','src/usage-status.js','src/manual-entry.js','src/config-recovery.js','src/credential-store.js','src/platform-paths.js','src/read-errors.js')) {
            node --check $f
            Write-Host "ok  $f"
          }

      - name: Electron suites (cancellation, usage status, provider reader)
        run: |
          npm run test:electron
          npm run test:electron:usage
          npm run test:electron:reader

      - name: Failure-path suites
        run: node test/run-failure-phases.cjs --out test-results/failure-phases

      - name: Build the packages
        run: npx electron-builder --win --publish=never

      - name: Assert the built binary is x64, natively
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $exe = Get-ChildItem -Recurse -Filter 'AI-Usage-Monitor.exe' dist |
            Select-Object -First 1 -ExpandProperty FullName
          # The PE header's machine field: 0x8664 is x64, 0x014c is x86,
          # 0xAA64 is arm64. Read it rather than trust the target name.
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $text = "PE machine 0x{0:X4} for $exe" -f $machine
          Write-Host $text
          $text | Out-File -FilePath test-results/binary-arch.txt -Encoding utf8
          if ($machine -ne 0x8664) { Write-Error 'the built executable is not x64'; exit 1 }
          'the package matches the architecture of the machine that built and ran it' |
            Out-File -FilePath test-results/binary-arch.txt -Append -Encoding utf8

      # --source proves CORRESPONDENCE as well as contents: every application
      # file in the archive is compared byte for byte with the checked-out
      # source it was built from, so a stale archive cannot pass as evidence.
      - name: Verify what is actually inside the package
        run: node test/verify-package-contents.cjs --app dist/win-unpacked --source . --out test-results/package

      - name: Launch the packaged application twice on a synthetic profile
        run: node test/packaged-smoke.cjs --exe dist/win-unpacked/AI-Usage-Monitor.exe --out test-results/packaged-unpacked

      - name: Launch the portable executable
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter '*portable*.exe' | Select-Object -First 1
          if (-not $portable) { throw 'no portable executable was produced' }
          node test/packaged-smoke.cjs --exe $portable.FullName --out test-results/packaged-portable

      - name: Responsive design captures
        run: npm run test:electron:screens -- test-results/screenshots

      - name: Dependency audit (reported, never auto-fixed)
        shell: pwsh
        run: |
          npm audit --json > test-results/npm-audit.json
          npm audit || Write-Host "::warning::npm audit reported findings — see test-results/npm-audit.json"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-windows-x64-evidence
          path: test-results/
          if-no-files-found: warn

      - name: Upload the Windows x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-Monitor-win-x64-unsigned
          path: |
            dist/*Setup*.exe
            dist/*portable*.exe
          if-no-files-found: error
